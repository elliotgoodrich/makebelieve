name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  compiler: Clang, cpp: clang++, build_type: Debug}
          - {os: ubuntu-latest,  compiler: Clang, cpp: clang++, build_type: Release}
          - {os: ubuntu-latest,  compiler: GCC,   cpp: g++,     build_type: Debug}
          - {os: ubuntu-latest,  compiler: GCC,   cpp: g++,     build_type: Release}
          - {os: windows-latest, compiler: MSVC,                build_type: Debug}
          - {os: windows-latest, compiler: MSVC,                build_type: Release}
    name: ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
    - name: Allow unprivileged user namespaces
      if: runner.os == 'Linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Ensure fusermount3 can unmount without a user namespace
      if: runner.os == 'Linux'
      # Belt and braces alongside the sysctl above: fusermount3 should
      # already be setuid-root on ubuntu-latest, but that's ambient image
      # state we don't control, and it's been observed missing on some
      # runner instances (fusermount3 -u failing with EPERM even though
      # the very same job's mount succeeded) while other jobs in the same
      # CI run, on other runner instances, were unaffected - consistent
      # with an inconsistency across GitHub's runner pool rather than
      # anything this repository's code can influence. Setting the bit
      # ourselves removes the dependency on that ambient state entirely.
      run: |
        FUSERMOUNT="$(command -v fusermount3)"
        sudo chown root:root "$FUSERMOUNT"
        sudo chmod u+s "$FUSERMOUNT"
    - name: Enable ProjFS
      if: runner.os == 'Windows'
      shell: powershell
      run: Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -NoRestart
    - name: Configure CMake
      run: >
        cmake -B build
        ${{ runner.os == 'Linux' && format('-DCMAKE_CXX_COMPILER={0} -DCMAKE_BUILD_TYPE={1}', matrix.cpp, matrix.build_type) || '' }}
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}
    - name: Test
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=clang++
        -DENABLE_CLANG_TIDY=ON
    - name: Build (runs clang-tidy)
      run: cmake --build build

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Run clang-format
      run: >
        git ls-files -z 'experiments/*.cpp' 'experiments/*.hpp'
        | xargs -0 clang-format --dry-run --Werror
