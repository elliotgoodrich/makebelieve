name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04,   compiler: Clang, cpp: clang++-19, apt: clang-19, build_type: Debug}
          - {os: ubuntu-24.04,   compiler: Clang, cpp: clang++-19, apt: clang-19, build_type: Release}
          - {os: ubuntu-24.04,   compiler: GCC,   cpp: g++-14,     apt: g++-14,   build_type: Debug}
          - {os: ubuntu-24.04,   compiler: GCC,   cpp: g++-14,     apt: g++-14,   build_type: Release}
          - {os: windows-latest, compiler: MSVC,  cpp: cl,                        build_type: Debug}
          - {os: windows-latest, compiler: MSVC,  cpp: cl,                        build_type: Release}
    name: ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: >
        sudo apt-get update && sudo apt-get install -y
        libfuse3-dev pkg-config ${{ matrix.apt }}
    - name: Allow unprivileged user namespaces
      if: runner.os == 'Linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Enable ProjFS
      if: runner.os == 'Windows'
      shell: powershell
      run: Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -NoRestart
    - name: Install WinFsp
      if: runner.os == 'Windows'
      shell: powershell
      run: choco install winfsp -y --no-progress
    # Ninja, unlike the Visual Studio generator, needs the environment a
    # Developer Command Prompt sets up (cl, INCLUDE, LIB, and Visual Studio's
    # bundled ninja on PATH), so export what vcvars64.bat changes to the steps
    # below.
    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          $name, $value = $_ -split '=', 2
          if ($before[$name] -ne $value) { "$name=$value" }
        } | Add-Content $env:GITHUB_ENV
    # Ninja on every platform: the default generators (Make, MSBuild) run one
    # compile at a time. The compiler is named explicitly because the Windows
    # runner also has MinGW's g++ on PATH.
    - name: Configure CMake
      run: >
        cmake -B build -G Ninja
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}
    - name: Test
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install dependencies
      run: >
        sudo apt-get update && sudo apt-get install -y
        libfuse3-dev pkg-config clang-19 clang-tidy-19
    - name: Configure CMake
      # CLANG_TIDY_EXE is the cache variable find_program() fills in, so setting
      # it here pins clang-tidy to the same release as the compiler.
      run: >
        cmake -B build -G Ninja
        -DCMAKE_CXX_COMPILER=clang++-19
        -DENABLE_CLANG_TIDY=ON
        -DCLANG_TIDY_EXE=/usr/bin/clang-tidy-19
    - name: Build (runs clang-tidy)
      run: cmake --build build

  format:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run clang-format
      run: >
        git ls-files -z 'experiments/*.cpp' 'experiments/*.hpp' 'src/*.cpp' 'src/*.hpp'
        | xargs -0 clang-format --dry-run --Werror
